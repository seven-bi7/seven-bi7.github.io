  <script type="module">
    window.addEventListener('DOMContentLoaded', () => {

      const pAE1 = document.getElementById('paragrafo-AE-1');
      const pAE2 = document.getElementById('paragrafo-AE-2');
      const pAE3 = document.getElementById('paragrafo-AE-3');
      const pAE4 = document.getElementById('paragrafo-AE-4');

      let data, texts;
      let lang = "ita"; // "ita": italiano, "eng": english
      const request = new Request("testi.json", {
        headers: {
          'Accept': 'application/json'
        }
      });
      let response = fetch(request)
        .then((response) => response.json())
        .then((json) => {
          data = json;
          texts = data[lang];
          write();
          writeImages();
        })
        .catch(console.error);

      // function to write all texts
      function write() {
        if (window.innerWidth > 768) {
          pAE2.style.display = "none";
          pAE3.innerHTML = data["responsive"]["paragrafo-AE-3_desktop"];
          pAE4.innerHTML = data["responsive"]["paragrafo-AE-4_desktop"];
        } else {
          pAE2.innerHTML = data["responsive"]["paragrafo-AE-2"];
          pAE3.innerHTML = data["responsive"]["paragrafo-AE-3_mobile"];
        }
        
        for (const [key, value] of Object.entries(texts)) {
          const elem = document.getElementById(key);
          if (elem) {
            elem.innerHTML = value;
          }
        }
      }

      function writeImages() {
        const images = data['images'];
        for (const [key, value] of Object.entries(images)) {
          const imgElement = document.getElementById(key);
          if (imgElement) {
            imgElement.src = value;
          }
        }
      }

      // change language button
      document.getElementById('button-lang').addEventListener('click', () => {
        lang = (lang == "ita" ? "eng" : "ita");
        texts = data[lang];
        write();
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const timelineNavItems = document.querySelectorAll('.timeline-nav-item');
      const timelineSlider = document.querySelector('.timeline-slider-container');
      const timelineCards = document.querySelectorAll('.timeline-card');

      timelineNavItems.forEach(item => {
        item.addEventListener('click', () => {
          const targetYear = item.dataset.year;
          const targetCard = document.querySelector(`.timeline-card[data-year="${targetYear}"]`);

          if (targetCard && timelineSlider) {
            // Calculate scroll position to center the card
            const sliderRect = timelineSlider.getBoundingClientRect();
            const cardRect = targetCard.getBoundingClientRect();

            const scrollLeft = timelineSlider.scrollLeft + cardRect.left - sliderRect.left - (sliderRect.width / 2) + (cardRect.width / 2);

            timelineSlider.scrollTo({
              left: scrollLeft,
              behavior: 'smooth'
            });
          }
        });
      });
    });
  </script>
