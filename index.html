<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <title>7bit+1</title>

  <script type="module">
    window.addEventListener('DOMContentLoaded', () => {
      const request = new Request("./testi.json", {
        headers: {
          'Accept': 'application/json'
        }
      });

      let data, texts;
      let lang = "ita"; // "ita": italiano, "eng": english
      let response = fetch(request)
        .then((response) => response.json())
        .then((json) => {
          data = json;
          texts = data[lang];
          write();
        })
        .catch(console.error);

      // Elements to write text in
      const nav1 = document.getElementById('nav-1');
      const nav2 = document.getElementById('nav-2');
      const nav3 = document.getElementById('nav-3');
      const nav4 = document.getElementById('nav-4');
      const nav5 = document.getElementById('nav-5');
      const nav6 = document.getElementById('nav-6');
      const cAE1 = document.getElementById('citazione-AE-1');
      const pAE1 = document.getElementById('paragrafo-AE-1');
      const pAE2 = document.getElementById('paragrafo-AE-2');
      const pAE3 = document.getElementById('paragrafo-AE-3');
      const pAE4 = document.getElementById('paragrafo-AE-4');
      const tc1 = document.getElementById('titolo-cards-1');
      const tc2 = document.getElementById('titolo-cards-2');

      // function to write all texts
      function write() {
        const texts_nav = texts.nav;
        nav1.innerHTML = texts_nav[1];
        nav2.innerHTML = texts_nav[2];
        nav3.innerHTML = texts_nav[3];
        nav4.innerHTML = texts_nav[4];
        nav5.innerHTML = texts_nav[5];
        nav6.innerHTML = texts_nav[6];

        cAE1.innerHTML = texts['citazione-AE-1'];

        const texts_pAE = texts["paragrafo-AE"];
        pAE1.innerHTML = texts_pAE["1"];
        if (window.innerWidth > 768) {
          pAE2.style.display = "none";
          pAE3.innerHTML = texts_pAE["3_desktop"];
          pAE4.innerHTML = texts_pAE["4_desktop"];
        } else {
          pAE2.innerHTML = texts_pAE["2"];
          pAE3.innerHTML = texts_pAE["3_mobile"];
        }

        tc1.innerHTML = texts["titolo-cards-1"];
        tc2.innerHTML = texts["titolo-cards-2"];
      }

      // change language button
      document.getElementById('button-lang').addEventListener('click', () => {
        lang = (lang == "ita" ? "eng" : "ita");
        texts = data[lang];
        write();
      });
    });
  </script>
</head>

<body>
  <script src="scripts/nav.js"></script>
  <!-- NAVBAR-->
  <nav class="navbar is-black" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item px-3" href="">
        7bit+1
      </a>
      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>
    <div id="navbarMenu" class="navbar-menu">
      <div class="navbar-start">
        <a id="nav-1" class="navbar-item" href="#titolo-cards"></a>
        <a id="nav-2" class="navbar-item"></a>
        <a id="nav-3" class="navbar-item"></a>
        <a id="nav-4" class="navbar-item"></a>
        <a id="nav-5" class="navbar-item"></a>
        <a id="nav-6" class="navbar-item"></a>
      </div>
      <div class="navbar-end">
        <a id="button-lang" class="navbar-item">
          <strong>ITA/ENG</strong>
        </a>
      </div>
    </div>
  </nav>
  <!-- IMMAGINE MULTICOLORE TITOLO -->
  <img id="img-titolo" src="images/img1-p1.png" alt="titolo" />
  <!-- CITAZIONE A. E. -->
  <div id="citazione-AE">
    <div class="vertical-line"></div>
    <div class="citazione">
      <h2 id="citazione-AE-1"></h2>
      <h6>Albert Einstein, 1935</h6>
    </div>
  </div>
  <!-- PARAGRAFO A. E. -->
  <div id="paragrafo-AE">
    <h3 id="paragrafo-AE-1"></h3>
    <h4 id="paragrafo-AE-2"></h4>
    <div class="columns">
      <p id="paragrafo-AE-3" class="column is-half"></p>
      <p id="paragrafo-AE-4" class="columm is-half"></p>
    </div>
  </div>
  <!-- TITOLO CARDS -->
  <div id="titolo-cards">
    <div class="vertical-line"></div>
    <div class="titolo-sottotitolo">
      <h2 id="titolo-cards-1"></h2>
      <h3 id="titolo-cards-2"></h3>
    </div>
  </div>
  <!-- CARDS -->
  <div id="cards">
    <div class="slider">
      <img src="images/card1-p1.png" alt="card1">
      <img src="images/card2-p1.png" alt="card2">
      <img src="images/card3-p1.png" alt="card3">
      <img src="images/card4-p1.png" alt="card4">
      <img src="images/card5-p1.png" alt="card5">
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        /**
         * Converts rem units to pixels based on the root font size.
         * @param {number} rem - The value in rem units.
         * @returns {number} The equivalent value in pixels.
         */
        function remToPx(rem) {
          const rootFontSize = parseFloat(window.getComputedStyle(document.documentElement).fontSize);
          return rem * rootFontSize;
        }
        const slider = document.querySelector('.slider');
        const images = document.querySelectorAll('.slider img');
        const gap = remToPx(slider.style.gap);
        console.log(gap);
        let totalWidth = -gap * 0.6;

        images.forEach((image) => {
          totalWidth += image.width + gap;
        })
        slider.style.width = `${totalWidth}px`;
      });
    </script>
  </div>
  <!-- IMMAGINE GATTO STUDIOSO -->
  <img id="img-titolo" src="images/img2-p1.png" alt="gatto studioso" />
</body>

</html>
